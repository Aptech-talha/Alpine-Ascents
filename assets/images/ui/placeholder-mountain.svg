<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="mtnGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cfd8dc"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
    <linearGradient id="mtnGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="50%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f39c12" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <circle cx="680" cy="90" r="45" fill="#f39c12" opacity="0.3"/>
  <circle cx="680" cy="90" r="30" fill="#fff" opacity="0.85"/>
  <!-- Distant Range -->
  <polygon points="50,500 220,240 380,500" fill="url(#mtnGrad2)" opacity="0.5"/>
  <polygon points="450,500 620,210 780,500" fill="url(#mtnGrad2)" opacity="0.6"/>
  <!-- Main Peaks -->
  <polygon points="120,500 380,120 540,500" fill="url(#mtnGrad1)"/>
  <polygon points="380,120 400,160 370,180 395,220 360,260 540,500" fill="#1e272c" opacity="0.65"/>
  <!-- Foreground Ridge -->
  <polygon points="0,500 160,330 360,500" fill="#1c2833"/>
  <polygon points="300,500 520,310 800,500" fill="#17202a"/>
  <!-- Decorative Text / Logo -->
  <rect x="250" y="420" width="300" height="40" rx="8" fill="rgba(13, 22, 34, 0.75)" stroke="rgba(255,255,255,0.15)"/>
  <text x="400" y="445" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    ALPINE ASCENTS
  </text>
</svg>